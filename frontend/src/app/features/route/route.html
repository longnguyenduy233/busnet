<div class="page-container">
  @if (error$ | async; as error) {
    <div class="error-banner" role="alert">
      <mat-icon>error_outline</mat-icon> {{ error }}
    </div>
  }
  <div class="page-header">
    <h1>Route Management</h1>
    <button mat-raised-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon> New Route
    </button>
  </div>

  @if (loading$ | async) {
    <div class="spinner-container">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  } @else {
    <table
      mat-table
      [dataSource]="(routes$ | async) ?? []"
      matSort
      [matSortActive]="(sortBy$ | async) ?? 'name'"
      [matSortDirection]="(sortDir$ | async) ?? 'asc'"
      (matSortChange)="onSortChange($event)"
      class="mat-elevation-z2 full-width">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let route">{{ route.name }}</td>
      </ng-container>

      <ng-container matColumnDef="pointCount">
        <th mat-header-cell *matHeaderCellDef>Points</th>
        <td mat-cell *matCellDef="let route">
          <mat-chip-set>
            <mat-chip>{{ route.points.length }} point{{ route.points.length !== 1 ? 's' : '' }}</mat-chip>
          </mat-chip-set>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let route" class="actions-cell">
          <button mat-icon-button matTooltip="Edit" (click)="openEdit(route)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Delete" color="warn" (click)="confirmDelete(route)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">
          No routes found. Click "New Route" to add one.
        </td>
      </tr>
    </table>

    <mat-paginator
      [length]="total$ | async"
      [pageIndex]="((page$ | async) ?? 1) - 1"
      [pageSize]="(pageSize$ | async) ?? 10"
      [pageSizeOptions]="[5, 10, 25, 50]"
      showFirstLastButtons
      (page)="onPageChange($event)"
      aria-label="Select page of routes">
    </mat-paginator>
  }
</div>
