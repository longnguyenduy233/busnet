<div class="home-page">
  <section class="home-banner" aria-labelledby="home-banner-heading">
    <img
      src="/banner.jpeg"
      width="2544"
      height="980"
      alt="Yellow school bus on a suburban street at sunrise"
      class="home-banner-img"
      decoding="async"
      fetchpriority="high">
    <!-- Right-heavy gradient: photo is brightest on the left; keeps headline readable on the right. -->
    <div class="home-banner-scrim" aria-hidden="true"></div>

    <div class="home-banner-content">
      <h1 id="home-banner-heading" class="home-banner-title">Welcome to BusNet</h1>
      <p class="home-banner-lede">
        Fleet routes, buses, and live tracking — choose a module from the navigation bar to get started.
      </p>
    </div>
  </section>
</div>
