services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: busnet-sql
    environment:
      - SA_PASSWORD=YourStrong!Pass123
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sqlserver_data:
